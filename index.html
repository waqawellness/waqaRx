<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#33452f">
<title>WaqaWellness Rx</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Dancing+Script:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --green:#33452f; --green-dark:#2a3a26; --green-mid:#5b7355; --green-soft:#7f9779;
  --cream:#f7f5ee; --paper:#ffffff; --line:#d8d5c8; --dot:#8aa385; --ink:#33452f;
  --ui-bg:#f3f1e9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans',sans-serif;background:var(--ui-bg);color:#2b3a29;-webkit-font-smoothing:antialiased}

/* ---------- App chrome ---------- */
.topbar{background:var(--green);color:#fff;padding:.7rem 1rem;display:flex;align-items:center;gap:.7rem;position:sticky;top:0;z-index:50}
.topbar h1{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:600;letter-spacing:.5px}
.topbar .sub{font-size:.65rem;opacity:.85;letter-spacing:2.5px;text-transform:uppercase}
.topbar .spacer{flex:1}
.iconbtn{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:.35rem .6rem;font-size:.8rem;cursor:pointer}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:40}
.tab{flex:1;text-align:center;padding:.7rem .3rem;font-size:.85rem;font-weight:700;color:var(--green-soft);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{color:var(--green-dark);border-bottom-color:var(--green)}
.screen{display:none;max-width:820px;margin:0 auto;padding:1rem;padding-bottom:7rem}
.screen.active{display:block}

/* ---------- Form ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem}
.card h3{font-family:'Cormorant Garamond',serif;color:var(--green-dark);font-size:1.2rem;margin-bottom:.6rem;border-bottom:1px solid var(--line);padding-bottom:.35rem}
.grid{display:grid;gap:.7rem}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:2fr 1fr 1fr}
label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--green-soft);margin-bottom:.2rem}
input,select,textarea{width:100%;padding:.55rem .6rem;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.95rem;background:#fcfbf6;color:#2b3a29}
input:focus,select:focus,textarea:focus{outline:2px solid var(--dot);border-color:var(--dot)}
textarea{resize:vertical;min-height:70px}
.medrow{border:1px solid var(--line);border-radius:10px;padding:.6rem;margin-bottom:.6rem;background:#fcfbf6}
.medrow .toprow{display:flex;gap:.45rem;margin-bottom:.5rem}
.medrow .toprow input{flex:1;background:#fff}
.medrow .rem{border:none;background:#f3e9e6;color:#8a4b3b;border-radius:8px;width:38px;flex-shrink:0;font-size:1rem;cursor:pointer}
.medrow .dosectl{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:.4rem .75rem;font-size:.8rem;font-weight:700;color:#999;cursor:pointer}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.medrow select{width:auto;padding:.4rem .5rem;font-size:.85rem;background:#fff}
.addbtn{background:#fcfbf6;border:1px dashed var(--green-soft);color:var(--green);border-radius:8px;padding:.5rem .8rem;font-weight:700;cursor:pointer;font-size:.85rem}
.actionbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:.6rem .8rem;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;z-index:60}
.btn{border:none;border-radius:10px;padding:.65rem 1rem;font-weight:700;font-size:.85rem;cursor:pointer}
.btn.primary{background:var(--green);color:#fff}
.btn.ghost{background:#fcfbf6;color:var(--green-dark);border:1px solid var(--line)}
.btn.wa{background:#1fa855;color:#fff}
.btn:disabled{opacity:.5}
#toast{position:fixed;bottom:5.2rem;left:50%;transform:translateX(-50%);background:var(--green-dark);color:#fff;padding:.6rem 1.2rem;border-radius:20px;font-size:.85rem;z-index:99;display:none}

/* ---------- Patients ---------- */
.search{margin-bottom:.8rem}
.patient{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin-bottom:.6rem;cursor:pointer;display:flex;align-items:center;gap:.8rem}
.patient:hover{border-color:var(--dot)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.patient .meta{flex:1}
.patient .meta b{color:var(--green-dark)}
.patient .meta small{color:#888;display:block}
.fileno{font-size:.75rem;font-weight:700;color:var(--green-soft)}
.hist{background:#fcfbf6;border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin-bottom:.5rem;font-size:.85rem}
.hist b{color:var(--green-dark)}
.hist .row-actions{margin-top:.4rem;display:flex;gap:.5rem}
.hist .row-actions button{font-size:.75rem;padding:.3rem .7rem}
.empty{text-align:center;color:#999;padding:2.5rem 1rem;font-size:.9rem}

/* ============================================================
   PRESCRIPTION SHEET — matches the printed template
   ============================================================ */
.sheet-wrap{overflow:auto;background:#dfdcd0;padding:1rem;border-radius:12px}
.sheet{width:210mm;height:297mm;margin:0 auto;background:var(--paper);color:var(--ink);
  font-family:'EB Garamond',serif;font-size:12pt;line-height:1.35;
  padding:4mm 6mm;display:flex;flex-direction:column;position:relative}
.sheet .edge{height:2.2mm;background:var(--green-dark);flex-shrink:0}
.sheet svg{overflow:visible!important}
.sheet .frame{flex:1;margin:3mm 1mm;border:1.6px solid var(--green);position:relative;display:flex;flex-direction:column;min-height:0}
.sheet .frame::before{content:"";position:absolute;inset:1.4mm;border:.6px solid var(--green-mid);pointer-events:none}
.sheet .inner{flex:1;display:flex;flex-direction:column;padding:7mm 8mm 5mm;position:relative;z-index:1;min-height:0}

/* corner + edge ornaments */
.orn{position:absolute;z-index:2}
.orn svg{display:block;overflow:visible}
.orn.tl{top:4.5mm;left:4.5mm}
.orn.tr{top:4.5mm;right:4.5mm;transform:scaleX(-1)}
.orn.bl{bottom:4.5mm;left:4.5mm;transform:scaleY(-1)}
.orn.ct{top:-2.6mm;left:50%;transform:translateX(-50%);background:var(--paper);padding:0 2mm}
.orn.cb{bottom:-2.6mm;left:50%;transform:translateX(-50%) scaleY(-1);background:var(--paper);padding:0 2mm}
.orn.br-decor{bottom:4mm;right:4mm;opacity:.55}

/* watermark */
.wm{position:absolute;top:0;bottom:0;right:0;left:32%;display:flex;align-items:center;justify-content:center;z-index:0;pointer-events:none}
.wm img{width:105mm;max-height:105mm;object-fit:contain;opacity:.06}
.wm .wmtxt{font-family:'Cormorant Garamond',serif;font-size:44pt;color:var(--green);opacity:.05;transform:rotate(-24deg);white-space:nowrap}

/* header */
.rx-head{display:grid;grid-template-columns:1.05fr 1.2fr 1.05fr;gap:0;padding-bottom:3.5mm}
.rx-head .fields{border-right:.7px solid var(--green-mid);padding-right:5mm;padding-top:2mm}
.rx-head .doc{border-left:.7px solid var(--green-mid);padding-left:5mm;padding-top:2mm}
.fieldline{display:flex;font-size:11.5pt;margin-bottom:3.1mm;align-items:baseline}
.fieldline .k{width:17mm;flex-shrink:0}
.fieldline .c{width:4mm;flex-shrink:0}
.fieldline .v{flex:1;border-bottom:1.1px dotted var(--dot);min-height:5mm;font-weight:600;color:var(--green-dark);padding:0 1mm}
.brand{text-align:center;padding:0 4mm;display:flex;flex-direction:column;align-items:center;justify-content:center}
.brand img{max-height:48mm;max-width:78mm;object-fit:contain;mix-blend-mode:multiply}
.brand.has-img .bname,.brand.has-img .btag{display:none}
.brand .bname{font-family:'Cormorant Garamond',serif;font-size:23pt;font-weight:500;color:var(--green-dark);line-height:1.05;letter-spacing:.5px}
.brand .btag{font-size:7pt;letter-spacing:3.2px;color:var(--green-mid);margin-top:1.6mm;display:flex;align-items:center;gap:1.5mm}
.brand .btag::before,.brand .btag::after{content:"";display:inline-block;width:7mm;border-top:.8px solid var(--green-soft)}
.doc .dname{font-family:'Cormorant Garamond',serif;font-size:15.5pt;font-weight:700;color:var(--green-dark);letter-spacing:.4px}
.doc .dq{font-size:11pt;margin-top:1.2mm;letter-spacing:1px}
.doc .dcert{font-style:italic;font-size:11pt;margin-top:1.2mm;line-height:1.3}
.doc .dreg{font-size:10.5pt;margin-top:1.8mm}
.head-rule{border-top:1.4px solid var(--green);margin:0 -2mm}

/* body */
.rx-body{flex:1;display:grid;grid-template-columns:1fr 2.05fr;padding-top:4.5mm;min-height:0}
.rx-left{padding-right:4.5mm;border-right:.7px solid var(--green-mid)}
.rx-right{padding-left:5.5mm;position:relative}
.sec-title{font-size:12pt;letter-spacing:1.6px;color:var(--green-dark);font-weight:600;margin-bottom:2.5mm;display:flex;align-items:center;gap:1.8mm}
.sec-title .sc{font-size:9.5pt}
.sec-title.inv{border-bottom:1.1px solid var(--green);display:inline-flex;padding-bottom:.8mm;margin-bottom:2.5mm}
.block{margin-bottom:5mm;white-space:pre-wrap;font-size:11.5pt}
.vitals{list-style:none;margin:7mm 0 7mm}
.vitals li{margin-bottom:4mm;font-size:11.5pt;display:flex;align-items:center;gap:2mm}
.vitals li .lf{flex-shrink:0;display:inline-flex;align-items:center}
.vitals li .lf svg{display:block}
.vitals li .vk{width:15mm;flex-shrink:0}
.vitals li .vv{flex:1;border-bottom:1.1px dotted var(--dot);min-height:5mm;font-weight:600;color:var(--green-dark);padding:0 1mm}
.rxsym{font-family:'Cormorant Garamond',serif;font-size:28pt;font-weight:600;color:var(--green-dark);line-height:1}
.rxh{font-size:11pt;letter-spacing:1.8px;text-transform:uppercase;font-weight:600;color:var(--green-dark);border-bottom:.9px solid var(--green-soft);width:fit-content;padding-bottom:.6mm;margin-top:4mm}
.diagh{font-size:11pt;letter-spacing:1.8px;text-transform:uppercase;font-weight:600;color:var(--green-dark);margin-bottom:1.5mm}
.diagtxt{white-space:pre-wrap;font-size:11.5pt;margin-bottom:4mm}
.meds{margin-top:4mm}
.med{margin-bottom:4.5mm;font-size:12.5pt}
.med .mn{font-weight:600;color:var(--green-dark)}
.med .md{font-size:11pt;margin-left:5mm;color:var(--green)}
.med .md .sep{margin:0 3.5mm;color:var(--green-soft)}
.rx-notes{margin-top:5mm;white-space:pre-wrap;font-size:11.5pt;font-style:italic}

/* footer */
.rx-foot{border-top:1.6px solid var(--green);margin:3mm -2mm 0;padding:3.5mm 2mm 1mm;display:grid;grid-template-columns:1.15fr 1fr 1.05fr;gap:0;align-items:center}
.rx-foot .wl{border-right:.7px solid var(--green-mid);padding-right:4mm}
.rx-foot .wl .script{font-family:'Dancing Script',cursive;font-size:17.5pt;color:var(--green-dark);line-height:1.1}
.rx-foot .wl .wdiv{display:flex;align-items:center;gap:1.5mm;margin:.8mm 0}
.rx-foot .wl .wdiv::before,.rx-foot .wl .wdiv::after{content:"";width:8mm;border-top:.8px solid var(--green-soft)}
.rx-foot .wl small{font-size:9pt;letter-spacing:1.6px}
.rx-foot .dates{text-align:center;font-size:10.5pt;padding:0 3mm}
.rx-foot .dates .dv{font-weight:600;color:var(--green-dark);border-bottom:1.1px dotted var(--dot);display:inline-block;min-width:32mm;padding:0 2mm;min-height:4.5mm}
.rx-foot .dates .ddiv{display:flex;align-items:center;justify-content:center;gap:1.5mm;margin:1.2mm 0}
.rx-foot .dates .ddiv::before,.rx-foot .dates .ddiv::after{content:"";width:6mm;border-top:.8px solid var(--green-soft)}
.rx-foot .contact{border-left:.7px solid var(--green-mid);padding-left:4mm;font-size:12pt;font-weight:600;color:var(--green-dark)}
.rx-foot .contact .ph{display:flex;align-items:center;gap:2mm}
.rx-foot .contact .ph svg{flex-shrink:0}
.rx-foot .contact .web{font-size:9.5pt;font-weight:500;color:var(--green-mid);letter-spacing:.4px;margin-top:1.2mm}

@media(max-width:640px){
  .g2,.g3{grid-template-columns:1fr}
  .sheet{transform:scale(.44);transform-origin:top left;margin:0}
  .sheet-wrap{height:135mm}
  /* buttons sit at the end of the page instead of floating */
  .actionbar{position:static;border-top:1px solid var(--line);margin-top:1rem}
  .screen{padding-bottom:1rem}
  #toast{bottom:1.5rem}
}
/* export copy must always render at full size, even on mobile */
.exportwrap .sheet{transform:none!important;width:210mm!important;height:297mm!important;margin:0!important}
@media print{
  body>*{display:none!important}
  body>#printarea{display:block!important}
  #printarea .sheet{width:100%;height:287mm;transform:none}
  @page{size:A4 portrait;margin:5mm}
}
</style>
</head>
<body>

<header class="topbar">
  <div><h1>waqawellness</h1><div class="sub">Bloom · Birth · Bond</div></div>
  <div class="spacer"></div>
  <button class="iconbtn" onclick="openSettings()">⚙ Clinic</button>
</header>

<nav class="tabs">
  <button class="tab active" id="tab-rx" onclick="showScreen('rx')">New Prescription</button>
  <button class="tab" id="tab-patients" onclick="showScreen('patients')">Patients</button>
  <button class="tab" id="tab-preview" onclick="showScreen('preview')">Preview</button>
</nav>

<!-- ============ NEW PRESCRIPTION ============ -->
<section class="screen active" id="screen-rx">
  <div class="card">
    <h3>Patient</h3>
    <div class="grid g3">
      <div><label>Name</label><input id="f-name" list="patientlist" autocomplete="off" placeholder="Patient name"><datalist id="patientlist"></datalist></div>
      <div><label>Age</label><input id="f-age" inputmode="numeric" placeholder="e.g. 28"></div>
      <div><label>Gender</label><select id="f-gender"><option>Female</option><option>Male</option><option>Other</option></select></div>
    </div>
    <div class="grid g3" style="margin-top:.7rem">
      <div><label>Phone (WhatsApp)</label><input id="f-phone" inputmode="tel" placeholder="+91…"></div>
      <div><label>Date</label><input id="f-date" type="date"></div>
      <div><label>File no.</label><input id="f-fileno" placeholder="auto"></div>
    </div>
  </div>

  <div class="card">
    <h3>Chief Complaints</h3>
    <textarea id="f-complaints" placeholder="Presenting complaints…"></textarea>
  </div>

  <div class="card">
    <h3>Assessment</h3>
    <div class="grid g2">
      <div><label>Diet</label><input id="f-diet"></div>
      <div><label>Sleep</label><input id="f-sleep"></div>
      <div><label>Stool</label><input id="f-stool"></div>
      <div><label>Urine</label><input id="f-urine"></div>
      <div><label>Mizaj</label><input id="f-mizaj"></div>
    </div>
  </div>

  <div class="card">
    <h3>Diagnosis</h3>
    <textarea id="f-diagnosis" placeholder="Diagnosis…"></textarea>
  </div>

  <div class="card">
    <h3>℞ Medicines</h3>
    <div id="meds"></div>
    <button class="addbtn" onclick="addMedRow()">+ Add medicine</button>
    <div style="margin-top:.8rem"><label>Additional notes / advice</label><textarea id="f-notes" placeholder="Advice, precautions…"></textarea></div>
  </div>

  <div class="card">
    <h3>Investigations & Follow-up</h3>
    <div><label>Investigations</label><textarea id="f-invest" placeholder="Tests advised…"></textarea></div>
    <div class="grid g2" style="margin-top:.7rem">
      <div><label>Valid upto</label><input id="f-valid" type="date"></div>
      <div><label>Follow-up date</label><input id="f-follow" type="date"></div>
    </div>
  </div>
</section>

<!-- ============ PATIENTS ============ -->
<section class="screen" id="screen-patients">
  <div class="search"><input id="q" placeholder="Search by name, phone or file no…" oninput="renderPatients()"></div>
  <div id="patients"></div>
</section>

<!-- ============ PREVIEW ============ -->
<section class="screen" id="screen-preview">
  <div class="sheet-wrap"><div id="sheet-preview"></div></div>
</section>

<div class="actionbar">
  <button class="btn ghost" onclick="clearForm()">New</button>
  <button class="btn primary" onclick="saveRx()">Save</button>
  <button class="btn ghost" onclick="doPrint()" title="Print">🖨</button>
  <button class="btn ghost" onclick="exportPDF()">PDF</button>
  <button class="btn ghost" onclick="exportImage()">Image</button>
  <button class="btn wa" onclick="shareWhatsApp()">WhatsApp</button>
</div>
<div id="toast"></div>
<div id="printarea" style="display:none"></div>

<script>
/* ================= storage ================= */
const DB = {
  get(k,d){ try{return JSON.parse(localStorage.getItem('wq_'+k)) ?? d}catch(e){return d} },
  set(k,v){ localStorage.setItem('wq_'+k, JSON.stringify(v)) }
};
let patients = DB.get('patients',[]);
let rxs      = DB.get('rxs',[]);
let settings = DB.get('settings', {
  docName:'Dr. AYESHA FATIMA', docQual:'BUMS',
  docCert:'Cappa Certified Childbirth Educator',
  docReg:'Reg. no. 496/U/2016', phone:'+91 9063872320',
  website:'https://waqawellness.com/',
  clinic:'waqawellness', tagline:'BLOOM. BIRTH. BOND.',
  footLeft1:'Women Wellness', footLeft2:'Pregnancy & Motherhood',
  fileSeq: 1
});
const save = ()=>{ DB.set('patients',patients); DB.set('rxs',rxs); DB.set('settings',settings); };

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => d ? new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '';
const today = () => new Date().toISOString().slice(0,10);
let currentRxId = null;
function toast(m,ms=2200){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._x); t._x=setTimeout(()=>t.style.display='none',ms); }

/* ================= logo (remove box background) ================= */
let LOGO_URL = undefined;   // undefined = loading, null = none, string = ready
(function prepLogo(){
  const img = new Image();
  img.onload = () => {
    try{
      const c = document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
      const x = c.getContext('2d'); x.drawImage(img,0,0);
      const d = x.getImageData(0,0,c.width,c.height);
      for(let i=0;i<d.data.length;i+=4){
        const r=d.data[i],g=d.data[i+1],b=d.data[i+2];
        if(r>222 && g>216 && b>200) d.data[i+3]=0;          // knock out off-white box
        else if(r>210 && g>204 && b>188) d.data[i+3]=90;     // soften edge
      }
      x.putImageData(d,0,0);
      // crop away transparent margins so the logo takes no extra space
      let minX=c.width, minY=c.height, maxX=0, maxY=0;
      for(let y=0;y<c.height;y++) for(let px=0;px<c.width;px++){
        if(d.data[(y*c.width+px)*4+3] > 12){
          if(px<minX)minX=px; if(px>maxX)maxX=px;
          if(y<minY)minY=y; if(y>maxY)maxY=y;
        }
      }
      if(maxX>minX && maxY>minY){
        const pad = Math.round(c.width*0.01);
        minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
        maxX=Math.min(c.width-1,maxX+pad); maxY=Math.min(c.height-1,maxY+pad);
        const c2 = document.createElement('canvas');
        c2.width=maxX-minX+1; c2.height=maxY-minY+1;
        c2.getContext('2d').drawImage(c,minX,minY,c2.width,c2.height,0,0,c2.width,c2.height);
        LOGO_URL = c2.toDataURL('image/png');
      } else {
        LOGO_URL = c.toDataURL('image/png');
      }
    }catch(e){ LOGO_URL = 'logo.png'; }  // canvas tainted on file:// — use as-is with blend
    refreshPreviewIfVisible();
  };
  img.onerror = () => { LOGO_URL = null; };
  img.src = 'logo.png';
})();

/* ================= decorative SVGs ================= */
const C = {g:'#33452f', m:'#5b7355', s:'#7f9779', l:'#93a98c', xl:'#b7c4ae'};
const LEAF = `<svg width="16" height="16" viewBox="0 0 32 32" overflow="visible" xmlns="http://www.w3.org/2000/svg"><path d="M6 26 Q16 22 27 9" stroke="${C.s}" stroke-width="1.2" fill="none"/><path d="M12 21 q-2 -10 8 -13 q4 10 -8 13z" fill="${C.l}"/><path d="M19 14 q0 -7 8 -9 q2 7 -8 9z" fill="${C.s}"/></svg>`;

/* ================= screens ================= */
function showScreen(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  $('screen-'+n).classList.add('active'); $('tab-'+n).classList.add('active');
  if(n==='patients') renderPatients();
  if(n==='preview') $('sheet-preview').innerHTML = sheetHTML(collect());
}
function refreshPreviewIfVisible(){
  if($('screen-preview').classList.contains('active')) $('sheet-preview').innerHTML = sheetHTML(collect());
}

/* ================= medicines ================= */
const TIMINGS = ['After meal','Before meal','With meal','Empty stomach','At bedtime'];
const DURATIONS = ['3 days','5 days','1 week','10 days','2 weeks','3 weeks','1 month','2 months','3 months','Continue'];
const doseStr  = m => (m.m||m.a||m.n) ? `${m.m?'1':'0'}-${m.a?'1':'0'}-${m.n?'1':'0'}` : '';
const medParts = m => m.dose!==undefined && m.m===undefined
  ? [m.dose, m.dur].filter(Boolean)
  : [doseStr(m), m.timing, m.dur, m.instr].filter(Boolean);
const medDetail = m => medParts(m).join(' · ');

function addMedRow(m={}){
  // backward compatibility with old "1-0-1" text entries
  if(m.dose && m.m===undefined){
    const p = m.dose.split('-');
    m.m = +p[0]>0; m.a = +p[1]>0; m.n = +p[2]>0;
  }
  const opts = (list,val,ph) => `<option value="">${ph}</option>` +
    (val && !list.includes(val) ? `<option selected>${esc(val)}</option>` : '') +
    list.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('');
  const div = document.createElement('div'); div.className='medrow';
  div.innerHTML = `
    <div class="toprow">
      <input class="mname" placeholder="Medicine name" value="${esc(m.name||'')}">
      <button class="rem" title="Remove" onclick="this.closest('.medrow').remove()">✕</button>
    </div>
    <div class="dosectl">
      <button type="button" class="chip ${m.m?'on':''}" data-t="m" onclick="this.classList.toggle('on')">🌅 Morning</button>
      <button type="button" class="chip ${m.a?'on':''}" data-t="a" onclick="this.classList.toggle('on')">☀️ Afternoon</button>
      <button type="button" class="chip ${m.n?'on':''}" data-t="n" onclick="this.classList.toggle('on')">🌙 Night</button>
      <select class="timing">${opts(TIMINGS, m.timing||'', 'Timing…')}</select>
      <select class="dur">${opts(DURATIONS, m.dur||'', 'Duration…')}</select>
    </div>
    <input class="instr" placeholder="Instructions (e.g. with warm water)" value="${esc(m.instr||'')}" style="margin-top:.5rem;background:#fff">`;
  $('meds').appendChild(div);
}
function getMeds(){
  return [...document.querySelectorAll('.medrow')].map(r=>({
    name: r.querySelector('.mname').value.trim(),
    m: r.querySelector('[data-t="m"]').classList.contains('on'),
    a: r.querySelector('[data-t="a"]').classList.contains('on'),
    n: r.querySelector('[data-t="n"]').classList.contains('on'),
    timing: r.querySelector('.timing').value,
    dur: r.querySelector('.dur').value,
    instr: r.querySelector('.instr').value.trim()
  })).filter(m=>m.name);
}

/* ================= collect & fill form ================= */
function collect(){
  return {
    id: currentRxId, date:$('f-date').value, fileno:$('f-fileno').value.trim(),
    name:$('f-name').value.trim(), age:$('f-age').value.trim(), gender:$('f-gender').value,
    phone:$('f-phone').value.trim(), complaints:$('f-complaints').value.trim(),
    diet:$('f-diet').value.trim(), sleep:$('f-sleep').value.trim(), stool:$('f-stool').value.trim(),
    urine:$('f-urine').value.trim(), mizaj:$('f-mizaj').value.trim(),
    diagnosis:$('f-diagnosis').value.trim(),
    meds:getMeds(), notes:$('f-notes').value.trim(), invest:$('f-invest').value.trim(),
    valid:$('f-valid').value, follow:$('f-follow').value
  };
}
function fillForm(r){
  currentRxId = r.id||null;
  $('f-date').value=r.date||today(); $('f-fileno').value=r.fileno||'';
  $('f-name').value=r.name||''; $('f-age').value=r.age||''; $('f-gender').value=r.gender||'Female';
  $('f-phone').value=r.phone||''; $('f-complaints').value=r.complaints||'';
  $('f-diet').value=r.diet||''; $('f-sleep').value=r.sleep||''; $('f-stool').value=r.stool||'';
  $('f-urine').value=r.urine||''; $('f-mizaj').value=r.mizaj||'';
  $('f-diagnosis').value=r.diagnosis||'';
  $('f-notes').value=r.notes||''; $('f-invest').value=r.invest||'';
  $('f-valid').value=r.valid||''; $('f-follow').value=r.follow||'';
  $('meds').innerHTML=''; (r.meds&&r.meds.length?r.meds:[{}]).forEach(addMedRow);
}
function clearForm(){ fillForm({}); showScreen('rx'); }

/* ================= save ================= */
function saveRx(){
  const r = collect();
  if(!r.name){ alert('Please enter the patient name.'); return; }
  let p = patients.find(x=>x.name.toLowerCase()===r.name.toLowerCase() && (!r.phone || !x.phone || x.phone===r.phone));
  if(!p){
    p = {id:Date.now(), fileno:r.fileno || String(settings.fileSeq).padStart(4,'0'), name:r.name, age:r.age, gender:r.gender, phone:r.phone};
    if(!r.fileno) settings.fileSeq++;
    patients.push(p);
  } else {
    p.age=r.age||p.age; p.phone=r.phone||p.phone;
  }
  r.fileno = r.fileno || p.fileno; $('f-fileno').value = r.fileno;
  r.patientId = p.id;
  if(r.id){ const i = rxs.findIndex(x=>x.id===r.id); if(i>-1) rxs[i]=r; else {r.id=Date.now(); rxs.push(r);} }
  else { r.id=Date.now(); currentRxId=r.id; rxs.push(r); }
  save(); refreshDatalist();
  toast('Saved ✓  file no. '+r.fileno);
}

/* ================= patients screen ================= */
function refreshDatalist(){
  $('patientlist').innerHTML = patients.map(p=>`<option value="${esc(p.name)}">`).join('');
}
$('f-name').addEventListener('change',()=>{
  const p = patients.find(x=>x.name.toLowerCase()===$('f-name').value.trim().toLowerCase());
  if(p){ $('f-age').value=p.age||''; $('f-gender').value=p.gender||'Female'; $('f-phone').value=p.phone||''; $('f-fileno').value=p.fileno||''; }
});
function renderPatients(){
  const q = ($('q').value||'').toLowerCase();
  const list = patients.filter(p=>!q || p.name.toLowerCase().includes(q) || (p.phone||'').includes(q) || (p.fileno||'').includes(q));
  if(!list.length){ $('patients').innerHTML = '<div class="empty">No patients yet. Saved prescriptions will appear here.</div>'; return; }
  $('patients').innerHTML = list.map(p=>{
    const hist = rxs.filter(r=>r.patientId===p.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const histHTML = hist.map(r=>`<div class="hist"><b>${fmt(r.date)||'—'}</b> — ${esc((r.complaints||'').slice(0,80))||'(no complaints noted)'}
      <div class="row-actions">
        <button class="btn ghost" onclick='event.stopPropagation();loadRx(${r.id})'>Open</button>
        <button class="btn ghost" onclick='event.stopPropagation();printRx(${r.id})'>🖨</button>
      </div></div>`).join('');
    return `<div class="patient" onclick="this.querySelector('.hwrap').style.display = this.querySelector('.hwrap').style.display==='none'?'block':'none'">
      <div class="avatar">${esc((p.name||'?')[0].toUpperCase())}</div>
      <div class="meta"><b>${esc(p.name)}</b><small>${esc(p.age?p.age+' yrs':'')} ${esc(p.gender||'')} ${esc(p.phone||'')}</small>
        <div class="hwrap" style="display:none;margin-top:.5rem">${histHTML||'<small>No prescriptions.</small>'}
          <button class="btn primary" style="margin-top:.3rem" onclick='event.stopPropagation();newRxFor(${p.id})'>+ New prescription</button>
        </div>
      </div>
      <span class="fileno">#${esc(p.fileno)}</span></div>`;
  }).join('');
}
function loadRx(id){ const r=rxs.find(x=>x.id===id); if(r){ fillForm(r); showScreen('rx'); } }
function newRxFor(pid){ const p=patients.find(x=>x.id===pid); if(p){ fillForm({name:p.name,age:p.age,gender:p.gender,phone:p.phone,fileno:p.fileno,date:today()}); showScreen('rx'); } }
function printRx(id){ const r=rxs.find(x=>x.id===id); if(r){ $('printarea').innerHTML=sheetHTML(r); window.print(); } }

/* ================= print ================= */

/* ================= PDF / image export ================= */
const toBlob = (canvas,type,q) => new Promise(res=>canvas.toBlob(res,type,q));
function fname(r,ext){ return `Rx-${(r.name||'patient').replace(/[^\w]+/g,'_')}-${r.date||today()}.${ext}`; }

async function renderSheetCanvas(){
  const holder = document.createElement('div');
  holder.className = 'exportwrap';
  holder.style.cssText = 'position:fixed;left:-9999px;top:0;width:210mm;background:#ffffff;';
  holder.innerHTML = sheetHTML(collect());
  document.body.appendChild(holder);
  try{
    await document.fonts.ready;
    const el = holder.querySelector('.sheet');
    return await html2canvas(el,{scale:2.2,backgroundColor:'#ffffff',useCORS:true,logging:false});
  } finally { holder.remove(); }
}
function canvasToPdfBlob(canvas){
  const w = 210, h = Math.round(w*canvas.height/canvas.width*100)/100;
  const pdf = new jspdf.jsPDF({unit:'mm', format:[w,h], orientation: h>=w?'portrait':'landscape'});
  pdf.addImage(canvas.toDataURL('image/jpeg',0.93),'JPEG',0,0,w,h);
  return pdf.output('blob');
}
function download(blob,name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000);
}
async function exportPDF(){
  const r = collect(); if(!r.name){ alert('Enter patient details first.'); return; }
  toast('Generating PDF…',6000);
  try{ download(canvasToPdfBlob(await renderSheetCanvas()), fname(r,'pdf')); toast('PDF downloaded ✓'); }
  catch(e){ console.error(e); toast('PDF failed — see console'); }
}
async function exportImage(){
  const r = collect(); if(!r.name){ alert('Enter patient details first.'); return; }
  toast('Generating image…',6000);
  try{ download(await toBlob(await renderSheetCanvas(),'image/png'), fname(r,'png')); toast('Image downloaded ✓'); }
  catch(e){ console.error(e); toast('Image failed — see console'); }
}

/* ================= WhatsApp: share PDF + image files ================= */
async function shareWhatsApp(){
  const r = collect(); if(!r.name){ alert('Enter patient details first.'); return; }
  toast('Preparing prescription…',8000);
  let files;
  try{
    const canvas = await renderSheetCanvas();
    const [png, pdfB] = [await toBlob(canvas,'image/png'), canvasToPdfBlob(canvas)];
    files = [
      new File([pdfB], fname(r,'pdf'), {type:'application/pdf'}),
      new File([png],  fname(r,'png'), {type:'image/png'})
    ];
  }catch(e){ console.error(e); toast('Could not generate files'); return; }

  const medsTxt = (r.meds||[]).map((m,i)=>`${i+1}. ${m.name}${medDetail(m)?' — '+medDetail(m):''}`).join('\n');
  const caption = `Prescription — ${r.name}, ${fmt(r.date)}\n${settings.docName}, ${settings.clinic}\n${medsTxt?medsTxt+'\n':''}${settings.phone}`;

  // 1) Native share sheet with files (Android/iOS — pick WhatsApp)
  if(navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files, title:'Prescription', text:caption}); toast('Shared ✓'); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  // 2) Try image-only share (some devices reject multiple/pdf files)
  if(navigator.canShare && navigator.canShare({files:[files[1]]})){
    try{ await navigator.share({files:[files[1]], title:'Prescription', text:caption}); toast('Shared image ✓ (PDF downloading)'); download(files[0],files[0].name); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  // 3) Desktop fallback: download both, open WhatsApp chat to attach
  download(files[0],files[0].name); download(files[1],files[1].name);
  const digits = (r.phone||'').replace(/\D/g,'');
  const phone = digits.length===10 ? '91'+digits : digits;
  window.open(phone?`https://wa.me/${phone}`:'https://web.whatsapp.com/','_blank');
  toast('PDF + image downloaded — attach them in the WhatsApp chat that just opened', 5000);
}

/* ================= settings ================= */
function openSettings(){
  const f = (k,label)=>{ const v = prompt(label, settings[k]); if(v!==null) settings[k]=v; };
  f('docName','Doctor name'); f('docQual','Qualification'); f('docCert','Certification line');
  settings.website = settings.website || 'https://waqawellness.com/';
  f('docReg','Registration no.'); f('phone','Clinic phone (shown on Rx)'); f('website','Website (shown on Rx)');
  save(); toast('Clinic details updated ✓');
}
